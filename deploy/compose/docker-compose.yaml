# Local dev stack for hiveD M0.
#
#   make compose-up      # Keeper + Postgres (default profile)
#   make compose-logs
#   make compose-down
#
# The `mind` profile below is a placeholder only — see mind's comment.
# There is no real mindD integration in M0 (see docs/adr/ADR-0004); it is
# not started by `compose-up` and is not required for a clean startup.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: hived
      POSTGRES_PASSWORD: hived
      POSTGRES_DB: hived
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hived -d hived"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  keeper:
    build:
      context: ../..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HIVED_PG_DSN: "postgres://hived:hived@postgres:5432/hived?sslmode=disable"
      HIVED_AUTO_MIGRATE: "true"
    ports:
      - "8080:8080" # connect-go API (gRPC + gRPC-Web + HTTP/JSON)
      - "9090:9090" # Prometheus metrics
    healthcheck:
      test: ["CMD", "/usr/local/bin/hived-keeper", "version"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Placeholder only, not started by default. mindD publishes
  # no container image of its own, so this service builds from a sibling
  # checkout at ../../../mindD — it will fail to build unless you
  # have that repo cloned next to hiveD, which is expected: this profile
  # exists to document the eventual integration point, not to work out of
  # the box on a standalone `git clone` of hiveD. See docs/adr/ADR-0004:
  # no real hiveD<->mindD integration ships in M0, so nothing here is on
  # the critical path for `make compose-up`.
  mind:
    build:
      context: ../../../mindD
    profiles: ["mind"]
    environment:
      MINDD_PG_DSN: "postgres://mindd:mindd@postgres:5432/mindd?sslmode=disable"
    ports:
      - "7777:7777" # gRPC
      - "8081:8080" # HTTP/JSON gateway (offset from Keeper's 8080)
