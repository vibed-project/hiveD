name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/keeper ./cmd/hived
      - run: go test ./... -short -count=1

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -short ./internal/...

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-import-boundary.sh

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
      # Keep these versions in sync with go.mod's google.golang.org/protobuf
      # and connectrpc.com/connect requirements (see scripts/buf-in-podman.sh).
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - run: buf lint
      - run: buf format --diff --exit-code
      - run: buf generate
      - run: git diff --exit-code gen/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # No released golangci-lint binary type-checks against a `go 1.26`
      # module yet; go run builds it from source against this module's own
      # toolchain instead of fetching a prebuilt binary. See .golangci.yml.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hived
          POSTGRES_PASSWORD: hived
          POSTGRES_DB: hived
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hived -d hived"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration -count=1 ./internal/store/...
        env:
          HIVED_TEST_PG_DSN: postgres://hived:hived@localhost:5432/hived?sslmode=disable

  container:
    runs-on: ubuntu-latest
    needs: [build, race, boundary, proto, lint, store]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/hived-keeper"
          echo "sha_tag=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
