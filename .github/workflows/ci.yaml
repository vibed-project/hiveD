name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/keeper ./cmd/hived
      - run: go test ./... -short -count=1

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -short ./...

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-import-boundary.sh

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
      # Keep these versions in sync with go.mod's google.golang.org/protobuf
      # and connectrpc.com/connect requirements (see scripts/buf-in-podman.sh).
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - run: buf lint
      - run: buf format --diff --exit-code
      - run: buf generate
      - run: git diff --exit-code gen/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # No released golangci-lint binary type-checks against a `go 1.26`
      # module yet; go run builds it from source against this module's own
      # toolchain instead of fetching a prebuilt binary. See .golangci.yml.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hived
          POSTGRES_PASSWORD: hived
          POSTGRES_DB: hived
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hived -d hived"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration -count=1 ./internal/store/...
        env:
          HIVED_TEST_PG_DSN: postgres://hived:hived@localhost:5432/hived?sslmode=disable
          # Without this the suite skips on an unreachable Postgres and the
          # job still reports success, which is how the store bugs shipped.
          HIVED_REQUIRE_PG: "1"

  container:
    runs-on: ubuntu-latest
    needs: [build, race, boundary, proto, lint, store]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags and version
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/hived-keeper"
          # On a tag build the version IS the tag; on main it is the commit.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${GITHUB_SHA}"
          fi
          # Multi-line outputs must use the heredoc form; a bare newline in
          # $GITHUB_OUTPUT is not parsed as a second value.
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:latest"
            echo "EOF"
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.created=${{ steps.tags.outputs.build_date }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=hived-keeper
            org.opencontainers.image.description=hiveD control plane (Keeper) and CLI

  # Binaries + checksums + GitHub Release. Tags only: this is the job that
  # makes `git push --tags` produce something a user can actually install.
  release:
    runs-on: ubuntu-latest
    needs: [build, race, boundary, proto, lint, store, container]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
