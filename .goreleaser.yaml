# GoReleaser builds the `hived` CLI and `hived-keeper` binaries for a tagged
# release and attaches them, with checksums, to the GitHub Release.
#
# Container images are NOT built here: the `container` job in
# .github/workflows/ci.yaml owns image publication so that images and
# binaries come from the same Dockerfile-independent ldflags contract.
#
# Validate locally with: scripts/goreleaser-in-podman.sh check
version: 2

project_name: hived

before:
  hooks:
    - go mod download

builds:
  - id: hived
    main: ./cmd/hived
    binary: hived
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vibed-project/hiveD/internal/version.Version={{ .Version }}
      - -X github.com/vibed-project/hiveD/internal/version.Commit={{ .FullCommit }}
      - -X github.com/vibed-project/hiveD/internal/version.BuildDate={{ .Date }}

  - id: hived-keeper
    main: ./cmd/keeper
    binary: hived-keeper
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vibed-project/hiveD/internal/version.Version={{ .Version }}
      - -X github.com/vibed-project/hiveD/internal/version.Commit={{ .FullCommit }}
      - -X github.com/vibed-project/hiveD/internal/version.BuildDate={{ .Date }}

archives:
  # One archive per platform containing both binaries, so `hived` and the
  # `hived-keeper` it talks to always come from the same build.
  - id: hived
    ids:
      - hived
      - hived-keeper
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # CHANGELOG.md is maintained by hand (Keep a Changelog); the generated
  # list here is only the commit-level detail underneath it.
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  header: |
    ## hiveD {{ .Tag }}

    hiveD is pre-1.0: the API surface under `proto/hived/v1alpha1` may still
    change between minor versions. See CHANGELOG.md for the curated notes and
    docs/adr/ for the architecture decisions behind this release.

    ### Container image

    ```
    docker pull ghcr.io/vibed-project/hived-keeper:{{ .Tag }}
    ```
  footer: |
    ---

    Verify a download against `checksums.txt`:

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```
